<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Home Planner - PocketSmart AI</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/planner.css">

</head>

<body>

<main class="planner">

    <a href="dashboard.html">
        ← Dashboard
    </a>

    <h1>
        Home Interior Planner
    </h1>


    <form id="homeForm">

        <input
            id="budget"
            type="number"
            min="1"
            step="0.01"
            placeholder="Budget ₹"
            required
        >


        <select id="room_type">

            <option>Living Room</option>
            <option>Bedroom</option>
            <option>Kitchen</option>
            <option>Study Room</option>

        </select>


        <select id="style">

            <option>Modern</option>
            <option>Minimalist</option>
            <option>Traditional</option>
            <option>Bohemian</option>

        </select>


        <select id="priority">

            <option>Balanced</option>
            <option>Comfort</option>
            <option>Storage</option>
            <option>Decor</option>

        </select>


        <input
            id="location"
            placeholder="Location"
            value="India"
        >


        <button type="submit">
            Generate Plan
        </button>

    </form>


    <div id="result"></div>

</main>


<script src="js/api.js"></script>
<script src="js/home.js"></script>

</body>
</html>
