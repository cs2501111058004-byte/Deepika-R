<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register - PocketSmart AI</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">

</head>

<body>

<main class="auth">

    <form id="registerForm"
          class="panel">

        <h1>Create Account</h1>

        <input
            id="name"
            placeholder="Full name"
            required
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="password"
            type="password"
            minlength="6"
            placeholder="Password (6+ chars)"
            required
        >

        <button type="submit">
            Register
        </button>

        <p id="message"></p>

        <a href="login.html">
            Already have an account?
        </a>

    </form>

</main>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
